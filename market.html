<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SYLUTION Marketplace</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@400&display=swap" rel="stylesheet"/>
<style>
body { font-family: 'Inter', sans-serif; background: #f8f9fa; }
.material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400; }
.btn-buy { background: linear-gradient(90deg, #006e1c 0%, #ba1a1a 100%); color: white; }
.skeleton { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); animation: load 1.5s infinite; }
@keyframes load { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
</style>
</head>
<body>

<!-- Header -->
<header class="fixed top-0 w-full bg-white/90 backdrop-blur shadow-sm z-50">
<div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
<div class="flex items-center gap-2">
<img class="h-10 w-10 rounded-lg" src="https://raw.githubusercontent.com/smbabanbaba-maker/Sylution/main/IMG-20251129-WA0028.jpg"/>
<span class="font-bold text-lg">SYLUTION LTD</span>
</div>
<a class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center" href="login.html">
<span class="material-symbols-outlined text-sm">person</span>
</a>
</div>
</header>

<!-- Main Content -->
<main class="pt-20 pb-24 px-4 max-w-7xl mx-auto">
<h1 class="text-2xl font-bold mb-4">SYLUTION Marketplace</h1>
<input class="w-full p-4 border-b-2 border-gray-300 focus:border-green-600 outline-none mb-6" id="searchInput" placeholder="Search products..." type="text"/>

<!-- Products Grid -->
<div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4" id="product-container">
<!-- Loading skeletons -->
<div class="bg-white rounded-xl p-4"><div class="skeleton h-32 mb-3 rounded"></div><div class="skeleton h-4 w-3/4 mb-2"></div><div class="skeleton h-4 w-1/2"></div></div>
<div class="bg-white rounded-xl p-4"><div class="skeleton h-32 mb-3 rounded"></div><div class="skeleton h-4 w-3/4 mb-2"></div><div class="skeleton h-4 w-1/2"></div></div>
<div class="bg-white rounded-xl p-4"><div class="skeleton h-32 mb-3 rounded"></div><div class="skeleton h-4 w-3/4 mb-2"></div><div class="skeleton h-4 w-1/2"></div></div>
<div class="bg-white rounded-xl p-4"><div class="skeleton h-32 mb-3 rounded"></div><div class="skeleton h-4 w-3/4 mb-2"></div><div class="skeleton h-4 w-1/2"></div></div>
</div>
</main>

<!-- Footer -->
<footer class="bg-black text-white py-8 px-4">
<div class="max-w-7xl mx-auto text-center"><p class="text-sm opacity-60">© 2025 SYLUTION LTD. Smart Technology • Green Future 🌍</p>
</div>
</footer>

<!-- Order Modal -->
<div class="fixed inset-0 z-[70] hidden bg-black/50" id="order-modal" onclick="if(event.target===this)closeOrderModal()">
<div class="absolute bottom-0 left-0 w-full bg-white rounded-t-3xl p-6" onclick="event.stopPropagation()">
<div class="w-12 h-1.5 bg-gray-300 rounded-full mx-auto mb-6"></div>
<h2 class="text-xl font-bold mb-2" id="modal-product-name">Product</h2>
<p class="text-green-600 font-bold text-lg mb-6" id="modal-product-price">₦0</p>
<input class="w-full p-3 border-b-2 border-gray-300 mb-2" id="order-phone" placeholder="Phone: 803 000 0000" type="tel"/>
<button class="w-full py-4 btn-buy rounded-xl font-bold mt-4" onclick="confirmOrder()">Confirm & Order</button>
<button class="w-full py-3 mt-2 text-gray-600" onclick="closeOrderModal()">Cancel</button>
</div>
</div>

<script>
// SUPABASE CONFIG
const SUPABASE_URL = 'https://svmtbhlaiowbcfzgczsp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_1T9UuK1Pxz6ANKaUELwWrA_8Ky_wxWS';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let allProducts = [];
let currentProduct = {};

// LOAD PRODUCTS
async function loadProducts() {
    const container = document.getElementById('product-container');
    try {
        const { data, error } = await supabase.from('products').select('*').eq('is_available', true).order('is_featured', { ascending: false });
        if (error) throw error;
        allProducts = data || [];
        renderProducts(allProducts);
    } catch (e) {
        console.error('Error:', e);
        container.innerHTML = '<div class="col-span-full text-center p-10"><p class="text-red-500">Error: ' + e.message + '</p><button onclick="loadProducts()" class="btn-buy px-6 py-2 rounded mt-4">Retry</button></div>';
    }
}

// RENDER PRODUCTS
function renderProducts(products) {
    const container = document.getElementById('product-container');
    if (products.length === 0) {
        container.innerHTML = '<div class="col-span-full text-center p-10"><p>No products found</p></div>';
        return;
    }
    container.innerHTML = products.map(p => `
        <div class="bg-white rounded-xl overflow-hidden shadow hover:shadow-lg transition-shadow">
            <div class="aspect-square bg-gray-100 relative">
                ${p.image_url ? `<img class="w-full h-full object-cover" src="${p.image_url}" onerror="this.style.display='none'"/>` : ''}                ${p.is_featured ? '<div class="absolute top-2 left-2 bg-green-600 text-white text-xs px-2 py-1 rounded">Featured</div>' : ''}
            </div>
            <div class="p-3">
                <h3 class="font-semibold text-sm mb-2 line-clamp-2">${p.name}</h3>
                <p class="text-green-600 font-bold mb-3">₦${Number(p.price).toLocaleString()}</p>
                <button class="w-full py-2 btn-buy rounded-lg text-sm font-bold" onclick="openOrder('${p.name.replace(/'/g, "\\'")}', ${p.price})">
                    Buy Now
                </button>
            </div>
        </div>
    `).join('');
}

// OPEN ORDER MODAL
function openOrder(name, price) {
    currentProduct = { name, price };
    document.getElementById('modal-product-name').textContent = name;
    document.getElementById('modal-product-price').textContent = '₦' + price.toLocaleString();
    document.getElementById('order-modal').classList.remove('hidden');
}

// CLOSE MODAL
function closeOrderModal() {
    document.getElementById('order-modal').classList.add('hidden');
}

// CONFIRM ORDER
async function confirmOrder() {
    const phone = document.getElementById('order-phone').value.trim();
    if (!phone || phone.length < 10) { alert('Please enter a valid phone number'); return; }
    
    const btn = event.target;
    btn.innerHTML = 'Processing...';
    btn.disabled = true;

    try {
        await supabase.from('orders').insert([{
            buyer_phone: '+234' + phone.replace(/^0+/, ''),
            total_price: currentProduct.price,
            status: 'pending',
            notes: currentProduct.name
        }]);

        const msg = `Sannu! Ina son saya: ${currentProduct.name} (₦${currentProduct.price.toLocaleString()}). Lambar ta: +234${phone.replace(/^0+/, '')}`;
        window.open(`https://wa.me/2349063436048?text=${encodeURIComponent(msg)}`, '_blank');
        closeOrderModal();
        document.getElementById('order-phone').value = '';
    } catch (e) {
        alert('Error: ' + e.message);
    }    btn.innerHTML = 'Confirm & Order';
    btn.disabled = false;
}

// SEARCH
document.getElementById('searchInput').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    const filtered = allProducts.filter(p => p.name.toLowerCase().includes(q) || (p.description && p.description.toLowerCase().includes(q)));
    renderProducts(filtered);
});

// INITIALIZE
document.addEventListener('DOMContentLoaded', loadProducts);
</script>
</body></html>
