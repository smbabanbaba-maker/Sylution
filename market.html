<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SYLUTION Marketplace</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@400&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#f5f5f5}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400}
.header{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,0.1);position:sticky;top:0;z-index:100}
.container{max-width:1400px;margin:0 auto;padding:1rem}
.nav{display:flex;justify-content:space-between;align-items:center;padding:1rem 0}
.logo{display:flex;align-items:center;gap:0.75rem;font-weight:700;font-size:1.25rem;font-family:'Montserrat',sans-serif}
.logo img{width:40px;height:40px;border-radius:8px}
.nav-links{display:flex;gap:2rem;align-items:center}
.nav-links a{color:#333;text-decoration:none;font-weight:500}
.nav-links a:hover{color:#006e1c}
.btn{padding:0.625rem 1.25rem;border-radius:9999px;font-weight:600;cursor:pointer;border:none;transition:all 0.3s}
.btn-primary{background:linear-gradient(90deg,#006e1c,#ba1a1a);color:#fff}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,110,28,0.3)}
.btn-outline{border:2px solid #006e1c;color:#006e1c;background:transparent}
.search-bar{display:flex;gap:1rem;margin:1.5rem 0;align-items:center}
.search-bar input{flex:1;padding:0.875rem 1rem;border:2px solid #e5e5e5;border-radius:0.5rem;font-size:1rem}
.search-bar input:focus{outline:none;border-color:#006e1c}
.filter-select{padding:0.875rem;border:2px solid #e5e5e5;border-radius:0.5rem;background:#fff;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.5rem;margin-top:1.5rem}
.card{background:#fff;border-radius:1rem;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.08);transition:all 0.3s}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,0.12)}
.card-img{width:100%;height:250px;object-fit:cover;background:#eee}
.card-body{padding:1rem}
.card-title{font-weight:600;margin-bottom:0.5rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-price{color:#006e1c;font-weight:700;font-size:1.125rem;margin-bottom:0.25rem}
.card-original{color:#999;text-decoration:line-through;font-size:0.875rem;margin-bottom:0.75rem}
.card-location{color:#666;font-size:0.75rem;margin-bottom:0.75rem;display:flex;align-items:center;gap:0.25rem}
.card-actions{display:flex;gap:0.5rem}
.card-actions button{flex:1}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;align-items:center;justify-content:center;padding:1rem}
.modal.active{display:flex}
.modal-content{background:#fff;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;border-radius:1rem;padding:1.5rem;position:relative}
.modal-close{position:absolute;top:1rem;right:1rem;background:none;border:none;font-size:1.5rem;cursor:pointer}
.form-group{margin-bottom:1rem}
.form-group label{display:block;margin-bottom:0.5rem;font-weight:500}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:0.75rem;border:2px solid #e5e5e5;border-radius:0.5rem;font-size:1rem}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{outline:none;border-color:#006e1c}
.badge{display:inline-block;padding:0.25rem 0.75rem;border-radius:9999px;font-size:0.75rem;font-weight:600}
.badge-featured{background:#ffd700;color:#000}
.badge-sale{background:#ff4444;color:#fff}
.cart-icon{position:relative}
.cart-count{position:absolute;top:-8px;right:-8px;background:#ba1a1a;color:#fff;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:600}
.loading{text-align:center;padding:2rem;color:#666}
.error{background:#fee;color:#c00;padding:1rem;border-radius:0.5rem;margin:1rem 0}
.success{background:#efe;color:#006e1c;padding:1rem;border-radius:0.5rem;margin:1rem 0}
.tabs{display:flex;gap:0.5rem;margin-bottom:1.5rem;border-bottom:2px solid #e5e5e5}
.tab{padding:0.75rem 1.5rem;cursor:pointer;border:none;background:none;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-2px}
.tab.active{color:#006e1c;border-bottom-color:#006e1c}
.hidden{display:none!important}
@media(max-width:768px){
.nav-links{display:none}
.grid{grid-template-columns:repeat(2,1fr);gap:1rem}
.card-img{height:150px}
}
</style>
</head>
<body>

<!-- Header -->
<header class="header">
<div class="container">
<div class="nav">
<a class="logo" href="index.html">
<img src="https://raw.githubusercontent.com/smbabanbaba-maker/Sylution/main/IMG-20251129-WA0028.jpg" alt="SYLUTION"/>
SYLUTION Market
</a>
<div class="nav-links">
<a href="index.html">Home</a>
<a href="market.html" style="color:#006e1c">Market</a>
<a href="#" onclick="showMyProducts()">My Products</a>
<a href="#" onclick="showOrders()">My Orders</a>
<div class="cart-icon" onclick="showCart()">
<span class="material-symbols-outlined">shopping_cart</span>
<span class="cart-count" id="cartCount">0</span>
</div>
<button class="btn btn-outline" id="authBtn" onclick="showAuth()">Login</button>
</div>
</div>
</div>
</header>

<!-- Main Content -->
<main class="container">
<!-- Search & Filter -->
<div class="search-bar">
<input id="searchInput" placeholder="Search products..." type="text"/>
<select class="filter-select" id="categoryFilter">
<option value="">All Categories</option>
<option value="Agriculture">🌾 Agriculture</option>
<option value="Drones">🚁 Drones</option>
<option value="Irrigation">💧 Irrigation</option>
<option value="Sensors">📡 Sensors</option>
<option value="Greenhouse">🏡 Greenhouse</option>
<option value="Solar Energy">️ Solar Energy</option>
<option value="Tools">🛠️ Tools</option>
</select>
<select class="filter-select" id="locationFilter">
<option value="">All Locations</option>
<option value="Kano">Kano</option>
<option value="Lagos">Lagos</option>
<option value="Abuja">Abuja</option>
<option value="Kaduna">Kaduna</option>
</select>
<button class="btn btn-primary" onclick="showAddProduct()">+ Add Product</button>
</div>

<!-- Tabs -->
<div class="tabs">
<button class="tab active" onclick="switchTab('all')">All Products</button>
<button class="tab" onclick="switchTab('featured')">Featured</button>
<button class="tab" onclick="switchTab('sales')">On Sale</button>
</div>

<!-- Products Grid -->
<div class="grid" id="productGrid">
<div class="loading">Loading products...</div>
</div>
</main>

<!-- Auth Modal -->
<div class="modal" id="authModal">
<div class="modal-content">
<button class="modal-close" onclick="closeModal('authModal')">×</button>
<h2 style="margin-bottom:1.5rem">Login / Register</h2>
<div id="authError" class="error hidden"></div>
<form id="loginForm" onsubmit="handleLogin(event)">
<div class="form-group">
<label>Email</label>
<input id="loginEmail" required="" type="email"/>
</div>
<div class="form-group">
<label>Password</label>
<input id="loginPassword" required="" type="password"/>
</div>
<button class="btn btn-primary" style="width:100%;padding:0.875rem" type="submit">Login</button>
<p style="text-align:center;margin-top:1rem">Don't have an account? <a href="#" onclick="toggleAuthMode()" style="color:#006e1c">Register</a></p>
</form>
<form class="hidden" id="registerForm" onsubmit="handleRegister(event)">
<div class="form-group">
<label>Full Name</label>
<input id="regName" required="" type="text"/>
</div>
<div class="form-group">
<label>Email</label>
<input id="regEmail" required="" type="email"/>
</div>
<div class="form-group">
<label>Phone</label>
<input id="regPhone" type="tel"/>
</div>
<div class="form-group">
<label>Password (min 6 chars)</label>
<input id="regPassword" minlength="6" required="" type="password"/>
</div>
<button class="btn btn-primary" style="width:100%;padding:0.875rem" type="submit">Create Account</button>
<p style="text-align:center;margin-top:1rem">Already have an account? <a href="#" onclick="toggleAuthMode()" style="color:#006e1c">Login</a></p>
</form>
</div>
</div>

<!-- Add Product Modal -->
<div class="modal" id="productModal">
<div class="modal-content">
<button class="modal-close" onclick="closeModal('productModal')">×</button>
<h2 style="margin-bottom:1.5rem">Add New Product</h2>
<div id="productError" class="error hidden"></div>
<form id="productForm" onsubmit="handleAddProduct(event)">
<div class="form-group">
<label>Product Name *</label>
<input id="prodName" required="" type="text"/>
</div>
<div class="form-group">
<label>Description</label>
<textarea id="prodDesc" rows="3"></textarea>
</div>
<div class="form-group">
<label>Price () *</label>
<input id="prodPrice" required="" type="number" min="0"/>
</div>
<div class="form-group">
<label>Original Price (₦) <small>(for discounts)</small></label>
<input id="prodOriginalPrice" type="number" min="0"/>
</div>
<div class="form-group">
<label>Category *</label>
<select id="prodCategory" required="">
<option value="">Select...</option>
<option value="Agriculture">Agriculture</option>
<option value="Drones">Drones</option>
<option value="Irrigation">Irrigation</option>
<option value="Sensors">Sensors</option>
<option value="Greenhouse">Greenhouse</option>
<option value="Solar Energy">Solar Energy</option>
<option value="Tools">Tools</option>
</select>
</div>
<div class="form-group">
<label>Location (City) *</label>
<input id="prodCity" required="" type="text"/>
</div>
<div class="form-group">
<label>State *</label>
<input id="prodState" required="" type="text"/>
</div>
<div class="form-group">
<label>Image URL</label>
<input id="prodImage" type="url"/>
</div>
<div class="form-group">
<label>Quantity Available</label>
<input id="prodQuantity" type="number" min="1" value="1"/>
</div>
<button class="btn btn-primary" style="width:100%;padding:0.875rem" type="submit">Add Product</button>
</form>
</div>
</div>

<!-- Order Modal -->
<div class="modal" id="orderModal">
<div class="modal-content">
<button class="modal-close" onclick="closeModal('orderModal')">×</button>
<h2 style="margin-bottom:0.5rem" id="orderProductName">Product</h2>
<p style="color:#006e1c;font-weight:700;font-size:1.25rem;margin-bottom:1rem" id="orderProductPrice">₦0</p>
<div class="form-group">
<label>Quantity</label>
<input id="orderQuantity" min="1" type="number" value="1"/>
</div>
<div class="form-group">
<label>Your Phone Number *</label>
<input id="orderPhone" placeholder="+234 800 000 0000" type="tel"/>
</div>
<div class="form-group">
<label>Delivery Address</label>
<textarea id="orderAddress" placeholder="Full delivery address" rows="2"></textarea>
</div>
<div class="form-group">
<label>Payment Method</label>
<select id="paymentMethod">
<option value="whatsapp">Pay on Delivery / WhatsApp</option>
<option value="card">Card Payment</option>
<option value="bank_transfer">Bank Transfer</option>
<option value="wallet">Wallet</option>
</select>
</div>
<button class="btn btn-primary" onclick="confirmOrder()" style="width:100%;padding:0.875rem">Place Order</button>
</div>
</div>

<script>
// ============================================
// SUPABASE CONFIG
// ============================================
const SUPABASE_URL = 'https://svmtbhlaiowbcfzgczsp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_1T9UuK1Pxz6ANKaUELwWrA_8Ky_wxWS';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let allProducts = [];
let cart = [];
let currentProduct = null;
let currentTab = 'all';

// ============================================
// INIT
// ============================================
async function init(){
    await checkAuth();
    await loadProducts();
    updateCartCount();
}

// ============================================
// AUTH FUNCTIONS
// ============================================
async function checkAuth(){
    const {data:{session}} = await supabase.auth.getSession();
    if(session){
        currentUser = session.user;
        document.getElementById('authBtn').textContent = 'Logout';
        document.getElementById('authBtn').onclick = handleLogout;
    }
}

function showAuth(){
    if(currentUser){
        handleLogout();
    }else{
        document.getElementById('authModal').classList.add('active');
    }
}

function toggleAuthMode(){
    document.getElementById('loginForm').classList.toggle('hidden');
    document.getElementById('registerForm').classList.toggle('hidden');
    document.getElementById('authError').classList.add('hidden');
}

async function handleLogin(e){
    e.preventDefault();
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    const errorDiv = document.getElementById('authError');
    
    const {data,error} = await supabase.auth.signInWithPassword({email,password});
    if(error){
        errorDiv.textContent = 'Invalid email or password';
        errorDiv.classList.remove('hidden');
        return;
    }
    
    currentUser = data.user;
    closeModal('authModal');
    await checkAuth();
    alert('Welcome back!');
    location.reload();
}

async function handleRegister(e){
    e.preventDefault();
    const name = document.getElementById('regName').value;
    const email = document.getElementById('regEmail').value;
    const phone = document.getElementById('regPhone').value;
    const password = document.getElementById('regPassword').value;
    const errorDiv = document.getElementById('authError');
    
    const {data,error} = await supabase.auth.signUp({
        email,password,
        options:{data:{full_name:name,phone}}
    });
    
    if(error){
        errorDiv.textContent = error.message;
        errorDiv.classList.remove('hidden');
        return;
    }
    
    // Create user profile
    if(data.user){
        await supabase.from('users').insert([{
            id:data.user.id,
            email,
            full_name:name,
            phone,
            role:'buyer'
        }]);
        await supabase.from('wallets').insert([{user_id:data.user.id,balance:0}]);
    }
    
    alert('Account created! Please check your email to confirm.');
    toggleAuthMode();
}

async function handleLogout(){
    await supabase.auth.signOut();
    currentUser = null;
    location.reload();
}

// ============================================
// PRODUCT FUNCTIONS
// ============================================
async function loadProducts(){
    const grid = document.getElementById('productGrid');
    grid.innerHTML = '<div class="loading">Loading products...</div>';
    
    try{
        let query = supabase.from('products').select('*').eq('is_available',true);
        
        if(currentTab === 'featured'){
            query = query.eq('is_featured',true);
        }else if(currentTab === 'sales'){
            query = query.not('original_price','is',null);
        }
        
        const {data,error} = await query.order('is_featured',{ascending:false}).order('created_at',{ascending:false});
        
        if(error) throw error;
        
        allProducts = data || [];
        renderProducts(allProducts);
    }catch(e){
        console.error('Error:',e);
        grid.innerHTML = '<div class="error">Error loading products: '+e.message+'</div>';
    }
}

function renderProducts(products){
    const grid = document.getElementById('productGrid');
    
    if(products.length === 0){
        grid.innerHTML = '<div class="loading">No products found</div>';
        return;
    }
    
    grid.innerHTML = products.map(p => {
        const discount = p.original_price ? Math.round((1 - p.price/p.original_price)*100) : 0;
        return `
            <div class="card">
                <img class="card-img" src="${p.image_url||''}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22280%22 height=%22250%22%3E%3Crect fill=%22%23eee%22 width=%22280%22 height=%22250%22/%3E%3Ctext fill=%22%23999%22 x=%2250%%22 y=%2250%%22 text-anchor=%22middle%22 dy=%22.3em%22%3ENo Image%3C/text%3E%3C/svg%3E'" alt="${p.name}"/>
                <div class="card-body">
                    <div style="display:flex;gap:0.5rem;margin-bottom:0.5rem">
                        ${p.is_featured?'<span class="badge badge-featured">Featured</span>':''}
                        ${discount>0?`<span class="badge badge-sale">-${discount}%</span>`:''}
                    </div>
                    <h3 class="card-title">${p.name}</h3>
                    <div class="card-price">₦${Number(p.price).toLocaleString()}</div>
                    ${p.original_price?`<div class="card-original">₦${Number(p.original_price).toLocaleString()}</div>`:''}
                    <div class="card-location">
                        <span class="material-symbols-outlined" style="font-size:14px">location_on</span>
                        ${p.city||p.location}
                    </div>
                    <div class="card-actions">
                        <button class="btn btn-outline" onclick="viewProduct('${p.id}')">View</button>
                        <button class="btn btn-primary" onclick="orderProduct('${p.id}')">Buy Now</button>
                    </div>
                </div>
            </div>
        `;
    }).join('');
}

function switchTab(tab){
    currentTab = tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');
    loadProducts();
}

// ============================================
// ADD PRODUCT
// ============================================
function showAddProduct(){
    if(!currentUser){
        showAuth();
        return;
    }
    document.getElementById('productModal').classList.add('active');
}

async function handleAddProduct(e){
    e.preventDefault();
    const errorDiv = document.getElementById('productError');
    
    const product = {
        seller_id: currentUser.id,
        name: document.getElementById('prodName').value,
        description: document.getElementById('prodDesc').value,
        price: parseFloat(document.getElementById('prodPrice').value),
        original_price: parseFloat(document.getElementById('prodOriginalPrice').value) || null,
        category: document.getElementById('prodCategory').value,
        city: document.getElementById('prodCity').value,
        state: document.getElementById('prodState').value,
        location: document.getElementById('prodCity').value + ', ' + document.getElementById('prodState').value,
        image_url: document.getElementById('prodImage').value || null,
        quantity: parseInt(document.getElementById('prodQuantity').value) || 1,
        is_featured: false
    };
    
    const {data,error} = await supabase.from('products').insert([product]);
    
    if(error){
        errorDiv.textContent = error.message;
        errorDiv.classList.remove('hidden');
        return;
    }
    
    alert('Product added successfully!');
    closeModal('productModal');
    document.getElementById('productForm').reset();
    loadProducts();
}

// ============================================
// ORDER FUNCTIONS
// ============================================
function orderProduct(productId){
    currentProduct = allProducts.find(p => p.id === productId);
    if(!currentProduct) return;
    
    document.getElementById('orderProductName').textContent = currentProduct.name;
    document.getElementById('orderProductPrice').textContent = '₦' + Number(currentProduct.price).toLocaleString();
    document.getElementById('orderModal').classList.add('active');
}

async function confirmOrder(){
    const phone = document.getElementById('orderPhone').value.trim();
    const address = document.getElementById('orderAddress').value.trim();
    const quantity = parseInt(document.getElementById('orderQuantity').value) || 1;
    const paymentMethod = document.getElementById('paymentMethod').value;
    
    if(!phone || phone.length < 10){
        alert('Please enter a valid phone number');
        return;
    }
    
    if(!currentUser){
        alert('Please login to place an order');
        closeModal('orderModal');
        showAuth();
        return;
    }
    
    const total = currentProduct.price * quantity;
    const orderNumber = 'SY-' + Date.now();
    
    const order = {
        order_number: orderNumber,
        buyer_id: currentUser.id,
        seller_id: currentProduct.seller_id,
        total_price: total,
        status: 'pending',
        payment_status: paymentMethod === 'wallet' ? 'paid' : 'unpaid',
        payment_method: paymentMethod,
        buyer_phone: phone,
        buyer_email: currentUser.email,
        shipping_address: address,
        notes: currentProduct.name
    };
    
    const {data,error} = await supabase.from('orders').insert([order]).select();
    
    if(error){
        alert('Error placing order: ' + error.message);
        return;
    }
    
    // Create order item
    await supabase.from('order_items').insert([{
        order_id: data[0].id,
        product_id: currentProduct.id,
        quantity: quantity,
        price: currentProduct.price
    }]);
    
    // Send WhatsApp message
    const msg = `Sannu! Na yi order:\n📦 ${currentProduct.name}\n💰 ₦${total.toLocaleString()}\n📱 ${phone}\n📍 ${address}\nOrder #: ${orderNumber}`;
    window.open(`https://wa.me/2349063436048?text=${encodeURIComponent(msg)}`,'_blank');
    
    alert('Order placed successfully! Order #' + orderNumber);
    closeModal('orderModal');
    showOrders();
}

function showOrders(){
    if(!currentUser){
        showAuth();
        return;
    }
    window.location.href = 'profile.html#orders';
}

function showMyProducts(){
    if(!currentUser){
        showAuth();
        return;
    }
    window.location.href = 'profile.html#myproducts';
}

// ============================================
// CART FUNCTIONS
// ============================================
function showCart(){
    alert('Cart feature coming soon!');
}

function updateCartCount(){
    document.getElementById('cartCount').textContent = cart.length;
}

// ============================================
// UTILS
// ============================================
function closeModal(id){
    document.getElementById(id).classList.remove('active');
}

function viewProduct(id){
    const product = allProducts.find(p => p.id === id);
    if(product){
        alert(`Product: ${product.name}\nPrice: ₦${product.price.toLocaleString()}\n\n${product.description||'No description'}`);
    }
}

// Search and filter
document.getElementById('searchInput').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    const filtered = allProducts.filter(p => 
        p.name.toLowerCase().includes(q) || 
        (p.description && p.description.toLowerCase().includes(q))
    );
    renderProducts(filtered);
});

document.getElementById('categoryFilter').addEventListener('change', (e) => {
    const cat = e.target.value;
    const filtered = cat ? allProducts.filter(p => p.category === cat) : allProducts;
    renderProducts(filtered);
});

// Close modals on outside click
window.onclick = function(event){
    if(event.target.classList.contains('modal')){
        event.target.classList.remove('active');
    }
}

// Initialize
init();
</script>
</body></html>
