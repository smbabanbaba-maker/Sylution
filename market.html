<script>
// ============================================
// SABON SUPABASE CONFIG - SYLUTION MARKET
// ============================================
const SUPABASE_URL = 'https://svmtbhlaiowbcfzgczsp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_1T9UuK1Pxz6ANKaUELwWrA_8Ky_wxWS';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let allProducts = [];
let currentProduct = { name: '', price: '' };

// ============================================
// LOAD PRODUCTS
// ============================================
async function loadProducts() {
    const container = document.getElementById('product-container');
    console.log('🔄 Ana loda products daga database...');
    
    try {
        const { data, error } = await supabase
            .from('products')
            .select('*')
            .eq('is_available', true)
            .order('is_featured', { ascending: false })
            .order('created_at', { ascending: false });

        if (error) {
            console.error('❌ Error:', error);
            throw error;
        }

        console.log('✅ Products loaded:', data);
        allProducts = data || [];
        renderProducts(allProducts);

    } catch (error) {
        console.error('❌ Error loading products:', error);
        container.innerHTML = `
            <div class="col-span-full text-center py-10">
                <span class="material-symbols-outlined text-5xl text-error mb-3">error</span>
                <p class="text-on-surface-variant mb-2">Matsala: ${error.message}</p>
                <button onclick="loadProducts()" class="btn-buy-gradient text-white px-6 py-2 rounded-full font-label-md">
                    Sake Gwadawa
                </button>
            </div>
        `;
    }
}

// ============================================// RENDER PRODUCTS
// ============================================
function renderProducts(products) {
    const container = document.getElementById('product-container');
    
    if (products.length === 0) {
        container.innerHTML = `
            <div class="col-span-full text-center py-10">
                <span class="material-symbols-outlined text-5xl text-on-surface-variant mb-3">inventory_2</span>
                <p class="text-on-surface-variant">Babu kayayyaki a yanzu</p>
            </div>
        `;
        return;
    }

    container.innerHTML = products.map(product => {
        const imageHtml = product.image_url 
            ? `<img class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105" src="${product.image_url}" alt="${product.name}" onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\\'w-full h-full flex items-center justify-center text-4xl bg-surface-container\\'>🌱</div>'"/>`
            : `<div class="w-full h-full flex items-center justify-center text-4xl bg-surface-container">🌱</div>`;

        const price = Number(product.price).toLocaleString();
        const safeName = product.name.replace(/'/g, "\\'");

        return `
            <div class="bg-surface-container-lowest rounded-xl overflow-hidden border border-on-surface/5 transition-all hover:shadow-lg group flex flex-col">
                <div class="relative aspect-square w-full bg-surface-container-high overflow-hidden">
                    ${imageHtml}
                    ${product.is_featured ? `
                        <div class="absolute top-1 left-1 flex flex-col gap-1">
                            <div class="bg-secondary/90 px-1.5 py-0.5 rounded-full">
                                <span class="text-[8px] font-bold text-on-secondary uppercase tracking-wider">Featured</span>
                            </div>
                        </div>
                    ` : ''}
                </div>
                <div class="p-2 flex-1 flex flex-col">
                    <h3 class="text-label-sm text-primary mb-1 line-clamp-2 h-8">${product.name}</h3>
                    <div class="mt-auto">
                        <span class="text-body-md font-bold text-secondary block mb-2">₦${price}</span>
                        <button class="w-full py-1.5 btn-buy-gradient text-white text-[10px] font-bold rounded-full flex items-center justify-center gap-1 active:scale-95" onclick="openOrderModal('${safeName}', '₦${price}')">
                            <span class="material-symbols-outlined text-[14px]">shopping_cart</span>
                            Buy
                        </button>
                    </div>
                </div>
            </div>
        `;
    }).join('');
}
// ============================================
// SEARCH FUNCTIONALITY
// ============================================
document.addEventListener('DOMContentLoaded', () => {
    loadProducts();
    
    const searchInput = document.getElementById('searchInput');
    if (searchInput) {
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allProducts.filter(p => 
                p.name.toLowerCase().includes(query) ||
                (p.description && p.description.toLowerCase().includes(query)) ||
                p.category.toLowerCase().includes(query)
            );
            renderProducts(filtered);
        });
    }
});

// ============================================
// ORDER MODAL
// ============================================
function openOrderModal(name, price) {
    currentProduct = { name, price };
    document.getElementById('modal-product-name').textContent = name;
    document.getElementById('modal-product-price').textContent = price;
    
    const modal = document.getElementById('order-modal');
    const content = document.getElementById('modal-content');
    
    modal.classList.remove('hidden');
    setTimeout(() => {
        content.classList.remove('translate-y-full');
    }, 10);
}

function closeOrderModal() {
    const content = document.getElementById('modal-content');
    content.classList.add('translate-y-full');
    setTimeout(() => {
        document.getElementById('order-modal').classList.add('hidden');
    }, 300);
}

// ============================================
// CONFIRM ORDER
// ============================================
async function confirmOrder() {
    const phoneInput = document.getElementById('order-phone');    const phoneNumber = phoneInput ? phoneInput.value.trim() : '';

    if (!phoneNumber || phoneNumber.length < 10) {
        alert('Da fatan za a sanya ingantacciyar lambar waya.');
        return;
    }

    const btn = document.getElementById('confirm-order-btn');
    const originalHTML = btn.innerHTML;
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Ana sarrafa oda...';
    btn.disabled = true;

    try {
        const { data, error } = await supabase
            .from('orders')
            .insert([{
                buyer_phone: '+234' + phoneNumber.replace(/^0+/, ''),
                total_price: parseFloat(currentProduct.price.replace(/[₦,]/g, '')),
                status: 'pending',
                payment_status: 'unpaid',
                payment_method: 'whatsapp',
                notes: `Product: ${currentProduct.name}`
            }])
            .select();

        if (error) throw error;

        const toast = document.getElementById('toast');
        toast.classList.remove('opacity-0', 'translate-y-[-20px]');
        toast.classList.add('opacity-100', 'translate-y-0');

        const message = `Sannu SYLUTION! 👋\n\nIna son saya:\n📦 Product: ${currentProduct.name}\n💰 Farashi: ${currentProduct.price}\n📱 Lambar wayata: +234${phoneNumber.replace(/^0+/, '')}\n\nDa fatan za a taimaka min.`;
        
        setTimeout(() => {
            window.open(`https://wa.me/2349063436048?text=${encodeURIComponent(message)}`, '_blank');
            toast.classList.add('opacity-0', 'translate-y-[-20px]');
            toast.classList.remove('opacity-100', 'translate-y-0');
            closeOrderModal();
            btn.innerHTML = originalHTML;
            btn.disabled = false;
            if (phoneInput) phoneInput.value = '';
        }, 2000);

    } catch (error) {
        console.error('Error creating order:', error);
        alert('An samu matsala: ' + error.message);
        btn.innerHTML = originalHTML;
        btn.disabled = false;
    }
}</script>
