<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SYLUTION Market - Debug</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#f5f5f5;padding:20px}
.container{max-width:800px;margin:0 auto}
.card{background:#fff;padding:20px;border-radius:12px;margin:20px 0;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
h1{color:#006e1c;margin-bottom:20px}
h2{margin-bottom:10px;font-size:1.25rem}
.status{padding:15px;border-radius:8px;margin:10px 0}
.success{background:#d4edda;color:#155724}
.error{background:#f8d7da;color:#721c24}
.loading{background:#fff3cd;color:#856404}
.product{border:1px solid #ddd;padding:15px;border-radius:8px;margin:10px 0}
.product h3{color:#006e1c;margin-bottom:8px}
.product p{margin:5px 0;color:#666}
.badge{display:inline-block;background:#006e1c;color:#fff;padding:2px 8px;border-radius:4px;font-size:12px;margin:5px}
code{background:#f4f4f4;padding:2px 6px;border-radius:4px;font-family:monospace}
</style>
</head>
<body>
<div class="container">
<h1>🧪 SYLUTION Market - Debug Test</h1>

<div id="connectionStatus"></div>

<div class="card">
<h2>Database Connection</h2>
<div id="dbInfo">Testing...</div>
</div>

<div class="card">
<h2>Products in Database: <span id="productCount">0</span></h2>
<div id="productsList">Loading...</div>
</div>
</div>

<script>
const SUPABASE_URL = 'https://svmtbhlaiowbcfzgczsp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_1T9UuK1Pxz6ANKaUELwWrA_8Ky_wxWS';

async function testConnection(){
    const connStatus = document.getElementById('connectionStatus');
    const dbInfo = document.getElementById('dbInfo');
    const productsList = document.getElementById('productsList');
    const productCount = document.getElementById('productCount');
    
    connStatus.innerHTML = '<div class="status loading"> Testing Supabase connection...</div>';
    
    try{
        // Create client
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        dbInfo.innerHTML = `
            <div class="status success">
                ✅ Connected to Supabase<br>
                <strong>URL:</strong> <code>${SUPABASE_URL}</code><br>
                <strong>Key:</strong> <code>${SUPABASE_KEY.substring(0, 30)}...</code>
            </div>
        `;
        
        // Query products
        connStatus.innerHTML += '<div class="status loading"> Fetching products from database...</div>';
        
        const {data, error} = await supabase
            .from('products')
            .select('*')
            .eq('is_available', true)
            .order('is_featured', {ascending: false})
            .order('created_at', {ascending: false})
            .limit(10);
        
        if(error){
            throw error;
        }
        
        console.log('✅ Products data:', data);
        
        if(!data || data.length === 0){
            productsList.innerHTML = `
                <div class="status error">
                    ⚠️ <strong>No products found!</strong><br><br>
                    This means either:<br>
                    1. The products table is empty<br>
                    2. No products have is_available=true<br><br>
                    <strong>Solution:</strong> Run the SQL script to insert sample products.
                </div>
            `;
            productCount.textContent = '0';
            return;
        }
        
        productCount.textContent = data.length;
        
        productsList.innerHTML = data.map(p => `
            <div class="product">
                <h3>${p.name}</h3>
                <p><strong>Price:</strong> ₦${Number(p.price).toLocaleString()}</p>
                <p><strong>Category:</strong> ${p.category || 'N/A'}</p>
                <p><strong>Location:</strong> ${p.city || p.location || 'N/A'}</p>
                <p><strong>Available:</strong> ${p.is_available ? 'Yes' : 'No'}</p>
                <p><strong>Featured:</strong> ${p.is_featured ? 'Yes' : 'No'}</p>
                ${p.is_featured ? '<span class="badge">Featured</span>' : ''}
            </div>
        `).join('');
        
        connStatus.innerHTML = '<div class="status success">✅ Successfully loaded ' + data.length + ' products!</div>';
        
    }catch(e){
        console.error('❌ Error:', e);
        connStatus.innerHTML = `
            <div class="status error">
                ❌ <strong>Error connecting to database</strong><br><br>
                <strong>Error:</strong> ${e.message}<br><br>
                <strong>Possible causes:</strong><br>
                1. Tables not created in database<br>
                2. RLS policies blocking access<br>
                3. Network connectivity issue<br><br>
                <strong>Check browser console (F12) for details.</strong>
            </div>
        `;
        dbInfo.innerHTML = '<div class="status error">❌ Connection failed</div>';
        productsList.innerHTML = '<div class="status error">Could not load products</div>';
    }
}

// Run test
testConnection();
</script>
</body></html>
