<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriMarket - SYLUTION LTD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --primary: #1a1a1a; --accent-red: #e63946; --accent-green: #4caf50; --accent-light-green: #8bc34a; --white: #ffffff; --light: #f8f9fa; --gray: #6c757d; --dark-gray: #343a40; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: var(--primary); overflow-x: hidden; background: var(--light); }
        
        /* Navigation */
        nav { position: fixed; top: 0; width: 100%; background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(10px); box-shadow: 0 2px 20px rgba(0,0,0,0.1); z-index: 1000; padding: 0.8rem 0; }
        .nav-container { max-width: 1200px; margin: 0 auto; padding: 0 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo-link { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .company-logo { height: 55px; width: auto; object-fit: contain; border-radius: 8px; }
        .logo-text { font-size: 1.6rem; font-weight: 800; color: var(--primary); }
        .logo-text span { background: linear-gradient(135deg, var(--accent-red), var(--accent-green)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-links { display: flex; list-style: none; gap: 2rem; align-items: center; }
        .nav-links a { text-decoration: none; color: var(--primary); font-weight: 500; transition: all 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: var(--accent-red); }
        .nav-cta { background: linear-gradient(135deg, var(--accent-red), var(--accent-green)); color: white !important; padding: 0.6rem 1.5rem; border-radius: 50px; }
        .menu-toggle { display: none; flex-direction: column; cursor: pointer; gap: 5px; }
        .menu-toggle span { width: 28px; height: 3px; background: var(--primary); border-radius: 3px; }

        /* Market Header */
        .market-header { margin-top: 75px; background: linear-gradient(135deg, var(--accent-green) 0%, var(--accent-light-green) 100%); color: white; padding: 2rem; text-align: center; }
        .market-header h1 { font-size: 2rem; margin-bottom: 0.5rem; }
        .market-header p { font-size: 1rem; opacity: 0.95; }

        /* Iframe Container */
        .market-container { 
            width: 100%; 
            height: calc(100vh - 200px); 
            min-height: 600px;
            position: relative;
            background: white;
        }
        
        .market-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Loading Overlay */
        .loading-overlay {
            position: absolute;            top: 0; left: 0; right: 0; bottom: 0;
            background: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: opacity 0.5s;
        }
        
        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid var(--light);
            border-top-color: var(--accent-red);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Footer */
        footer { background: #111; color: white; padding: 2rem; text-align: center; }
        .footer-social { display: flex; gap: 1rem; justify-content: center; margin-bottom: 1rem; }
        .footer-social a { width: 40px; height: 40px; background: rgba(255,255,255,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; text-decoration: none; transition: all 0.3s; }
        .footer-social a:hover { background: linear-gradient(135deg, var(--accent-red), var(--accent-green)); transform: translateY(-5px); }

        /* Responsive */
        @media (max-width: 768px) {
            .menu-toggle { display: flex; }
            .nav-links { position: fixed; top: 70px; right: -100%; width: 70%; height: 100vh; background: white; flex-direction: column; padding: 2rem; box-shadow: -5px 0 20px rgba(0,0,0,0.1); transition: right 0.3s; }
            .nav-links.active { right: 0; }
            .market-header h1 { font-size: 1.5rem; }
            .market-container { height: calc(100vh - 180px); }
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav>
        <div class="nav-container">            <a href="index.html" class="logo-link">
                <img src="https://raw.githubusercontent.com/smbabanbaba-maker/Sylution/main/IMG-20251129-WA0028.jpg" alt="SYLUTION" class="company-logo">
                <span class="logo-text">SY<span>LU</span>TION</span>
            </a>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="market.html" class="active">Market</a></li>
                <li><a href="contact.html" class="nav-cta">Contact</a></li>
            </ul>
            <div class="menu-toggle" onclick="toggleMenu()">
                <span></span><span></span><span></span>
            </div>
        </div>
    </nav>

    <!-- Market Header -->
    <div class="market-header">
        <h1>🌿 SYLUTION AgriMarket</h1>
        <p>Buy & Sell Agricultural Products Online</p>
    </div>

    <!-- Iframe Container -->
    <div class="market-container">
        <div class="loading-overlay" id="loadingOverlay">
            <div class="spinner"></div>
            <p>Loading AgriMarket...</p>
        </div>
        <iframe 
            src="https://smart-solve-sylution.base44.app"
            title="SYLUTION AgriMarket"
            allow="camera; microphone; geolocation; payment"
            allowfullscreen
            onload="document.getElementById('loadingOverlay').classList.add('hidden')">
        </iframe>
    </div>

    <!-- Footer -->
    <footer>
        <div class="footer-social">
            <a href="https://www.facebook.com/profile.php?id=61553057467392" target="_blank"><i class="fab fa-facebook-f"></i></a>
            <a href="https://x.com/sylution_ng" target="_blank"><i class="fab fa-twitter"></i></a>
            <a href="https://www.linkedin.com/company/sylution/" target="_blank"><i class="fab fa-linkedin-in"></i></a>
            <a href="https://www.instagram.com/official_sylution" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="https://www.tiktok.com/@sylution" target="_blank"><i class="fab fa-tiktok"></i></a>
        </div>
        <p>&copy; 2025 SYLUTION LTD. All Rights Reserved. 🌍</p>    </footer>

    <script>
        function toggleMenu() {
            document.getElementById('navLinks').classList.toggle('active');
        }
    </script>
</body>
</html>
