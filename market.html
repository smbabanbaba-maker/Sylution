<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriMarket - SYLUTION LTD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --primary: #1a1a1a; --accent-red: #e63946; --accent-green: #4caf50; --accent-light-green: #8bc34a; --white: #ffffff; --light: #f8f9fa; --gray: #6c757d; --dark-gray: #343a40; }
        html, body { height: 100%; overflow: hidden; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; background: white; }
        
        /* Navigation */
        nav { position: fixed; top: 0; width: 100%; background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(10px); box-shadow: 0 2px 20px rgba(0,0,0,0.1); z-index: 1000; padding: 0.8rem 0; }
        .nav-container { max-width: 1200px; margin: 0 auto; padding: 0 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo-link { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .company-logo { height: 55px; width: auto; object-fit: contain; border-radius: 8px; }
        .logo-text { font-size: 1.6rem; font-weight: 800; color: var(--primary); }
        .logo-text span { background: linear-gradient(135deg, var(--accent-red), var(--accent-green)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-links { display: flex; list-style: none; gap: 2rem; align-items: center; }
        .nav-links a { text-decoration: none; color: var(--primary); font-weight: 500; transition: all 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: var(--accent-red); }
        .nav-cta { background: linear-gradient(135deg, var(--accent-red), var(--accent-green)); color: white !important; padding: 0.6rem 1.5rem; border-radius: 50px; }
        .menu-toggle { display: none; flex-direction: column; cursor: pointer; gap: 5px; }
        .menu-toggle span { width: 28px; height: 3px; background: var(--primary); border-radius: 3px; }

        /* Market Header */
        .market-header {
            margin-top: 75px;
            background: linear-gradient(135deg, #2d5a27 0%, #4caf50 100%);
            color: white;
            padding: 1.5rem 2rem;
            text-align: center;
            flex-shrink: 0;
        }
        .market-header h1 { font-size: 1.8rem; margin-bottom: 0.3rem; }
        .market-header p { font-size: 0.95rem; opacity: 0.95; }

        /* Iframe Container - Fills the rest of the screen */
        .iframe-container {
            flex: 1;
            position: relative;
            width: 100%;
            overflow: hidden;
        }

        .iframe-container iframe {
            width: 100%;
            height: 100%;            border: none;
            display: block;
        }

        /* Loading Overlay */
        .loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: opacity 0.5s;
        }
        
        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid var(--light);
            border-top-color: var(--accent-green);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: var(--gray);
            font-size: 1rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .menu-toggle { display: flex; }
            .nav-links { position: fixed; top: 70px; right: -100%; width: 70%; height: 100vh; background: white; flex-direction: column; padding: 2rem; box-shadow: -5px 0 20px rgba(0,0,0,0.1); transition: right 0.3s; z-index: 999; }
            .nav-links.active { right: 0; }
            .market-header h1 { font-size: 1.4rem; }
            .market-header p { font-size: 0.85rem; }
        }
    </style></head>
<body>

    <!-- Navigation -->
    <nav>
        <div class="nav-container">
            <a href="index.html" class="logo-link">
                <img src="https://raw.githubusercontent.com/smbabanbaba-maker/Sylution/main/IMG-20251129-WA0028.jpg" alt="SYLUTION" class="company-logo">
                <span class="logo-text">SY<span>LU</span>TION</span>
            </a>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="market.html" class="active">Market</a></li>
                <li><a href="contact.html" class="nav-cta">Contact</a></li>
            </ul>
            <div class="menu-toggle" onclick="toggleMenu()">
                <span></span><span></span><span></span>
            </div>
        </div>
    </nav>

    <!-- Market Header -->
    <div class="market-header">
        <h1>🌿 SYLUTION AgriMarket</h1>
        <p>Kasuwar Noma ta Najeriya - Saye da Sayarwa Kai Tsaye</p>
    </div>

    <!-- Iframe Container -->
    <div class="iframe-container">
        <div class="loading-overlay" id="loadingOverlay">
            <div class="spinner"></div>
            <div class="loading-text">Ana lodin kasuwa...</div>
        </div>
        <iframe 
            src="https://react-9b6erc.onspace.build"
            title="SYLUTION AgriMarket"
            allow="camera; microphone; geolocation; payment"
            allowfullscreen
            onload="document.getElementById('loadingOverlay').classList.add('hidden')">
        </iframe>
    </div>

    <script>
        function toggleMenu() {
            document.getElementById('navLinks').classList.toggle('active');
        }    </script>
</body>
</html>
