<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SYLUTION Market - Test</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:system-ui,sans-serif;padding:20px;background:#f5f5f5}
.card{background:#fff;padding:20px;border-radius:8px;margin:10px 0;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.error{background:#fee;color:#c00;padding:15px;border-radius:8px}
.success{background:#efe;color:#006e1c;padding:15px;border-radius:8px}
.loading{color:#666;text-align:center;padding:20px}
.product{border:1px solid #ddd;padding:15px;border-radius:8px;margin:10px 0}
</style>
</head>
<body>
<h1>🧪 SYLUTION Market - Debug Test</h1>

<div id="status"></div>

<div class="card">
<h2>Connection Test</h2>
<div id="connection">Testing...</div>
</div>

<div class="card">
<h2>Products: <span id="count">0</span></h2>
<div id="products"></div>
</div>

<script>
const SUPABASE_URL = 'https://svmtbhlaiowbcfzgczsp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_1T9UuK1Pxz6ANKaUELwWrA_8Ky_wxWS';

async function test(){
    const status = document.getElementById('status');
    const connection = document.getElementById('connection');
    const productsDiv = document.getElementById('products');
    const countSpan = document.getElementById('count');
    
    try{
        // Test 1: Create client
        connection.innerHTML = '1️⃣ Creating Supabase client...';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        // Test 2: Query products
        connection.innerHTML = '2️⃣ Querying database...';
        status.innerHTML = '<div class="loading">Loading from Supabase...</div>';
        
        const {data, error} = await supabase
            .from('products')
            .select('*')
            .eq('is_available', true)
            .limit(10);
        
        if(error){
            throw error;
        }
        
        // Success!
        if(!data || data.length === 0){
            productsDiv.innerHTML = '<div class="error">️ Database is empty - No products found<br><br>Please add products to Supabase</div>';
            countSpan.textContent = '0';
        }else{
            countSpan.textContent = data.length;
            productsDiv.innerHTML = data.map(p => `
                <div class="product">
                    <strong>${p.name}</strong><br>
                    Price: ₦${Number(p.price).toLocaleString()}<br>
                    Category: ${p.category}<br>
                    Location: ${p.city || p.location}
                </div>
            `).join('');
            
            status.innerHTML = '<div class="success">✅ SUCCESS! Loaded ' + data.length + ' products from database!</div>';
        }
        
        connection.innerHTML = '✅ Connected to Supabase successfully!';
        
    }catch(e){
        console.error('Error:', e);
        status.innerHTML = '<div class="error">❌ ERROR: ' + e.message + '<br><br>' +
            'Possible causes:<br>' +
            '1. Supabase connection failed<br>' +
            '2. Products table does not exist<br>' +
            '3. API keys are incorrect<br>' +
            '4. Network issue<br><br>' +
            'Check console (F12) for details</div>';
        connection.innerHTML = '❌ Connection failed';
    }
}

test();
</script>
</body></html>
