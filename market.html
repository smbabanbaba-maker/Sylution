<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SYLUTION Market</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:system-ui,sans-serif;margin:0;padding:20px;background:#f5f5f5}
.container{max-width:1200px;margin:0 auto}
.header{background:#fff;padding:1rem;margin-bottom:2rem;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.logo{font-size:1.5rem;font-weight:700;color:#006e1c}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem}
.card{background:#fff;padding:1rem;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.card img{width:100%;height:150px;object-fit:cover;border-radius:4px;margin-bottom:0.5rem;background:#eee}
.card h3{margin:0.5rem 0;color:#333}
.price{color:#006e1c;font-weight:700;font-size:1.125rem}
.loading{text-align:center;padding:3rem;color:#666}
.error{background:#fee;color:#c00;padding:1rem;border-radius:8px;margin:1rem 0}
.success{background:#efe;color:#006e1c;padding:1rem;border-radius:8px;margin:1rem 0}
</style>
</head>
<body>
<div class="container">
<div class="header">
<div class="logo">SYLUTION Market</div>
</div>
<div id="status"><div class="loading">Loading products...</div></div>
<div class="grid" id="grid"></div>
</div>

<script>
const SUPABASE_URL = 'https://svmtbhlaiowbcfzgczsp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_1T9UuK1Pxz6ANKaUELwWrA_8Ky_wxWS';

async function load(){
    const status = document.getElementById('status');
    const grid = document.getElementById('grid');
    
    try{
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        console.log('Supabase client created');
        
        const {data, error} = await supabase
            .from('products')
            .select('*')
            .eq('is_available', true)
            .order('is_featured', {ascending: false})
            .limit(10);
        
        if(error){
            console.error('Supabase error:', error);
            throw error;
        }
        
        console.log('Products loaded:', data);
        
        if(!data || data.length === 0){
            status.innerHTML = '<div class="error">No products found</div>';
            return;
        }
        
        status.innerHTML = '<div class="success">✅ Loaded ' + data.length + ' products!</div>';
        
        grid.innerHTML = data.map(p => `
            <div class="card">
                <img src="${p.image_url||''}" alt="${p.name}" onerror="this.style.display='none'"/>
                <h3>${p.name}</h3>
                <div class="price">₦${Number(p.price).toLocaleString()}</div>
                <p style="color:#666;font-size:0.875rem">${p.category} • ${p.city||p.location}</p>
                ${p.is_featured ? '<span style="background:#ffd700;color:#000;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:600">Featured</span>' : ''}
            </div>
        `).join('');
        
    }catch(e){
        console.error('Error:', e);
        status.innerHTML = '<div class="error">Error: ' + e.message + '<br><br>Check console for details</div>';
    }
}

load();
</script>
</body></html>
