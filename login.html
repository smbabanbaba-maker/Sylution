<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sylution Market</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; background: linear-gradient(135deg, #006e1c 0%, #008f23 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
        .card { background: white; border-radius: 16px; padding: 2rem; width: 100%; max-width: 400px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .logo { text-align: center; margin-bottom: 2rem; }
        .logo h1 { color: #006e1c; font-size: 1.75rem; margin-bottom: 0.5rem; }
        .logo p { color: #666; }
        .tabs { display: flex; margin-bottom: 1.5rem; border-radius: 8px; overflow: hidden; }
        .tab { flex: 1; padding: 0.75rem; border: none; background: #f0f0f0; cursor: pointer; font-weight: 600; transition: all 0.3s; }
        .tab.active { background: #006e1c; color: white; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: #333; }
        input { width: 100%; padding: 0.875rem; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1rem; }
        input:focus { outline: none; border-color: #006e1c; }
        .btn { width: 100%; padding: 1rem; background: #006e1c; color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; margin-top: 0.5rem; }
        .btn:hover { background: #005214; }
        .error { background: #fee; color: #c00; padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; text-align: center; }
        .success { background: #efe; color: #060; padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; text-align: center; }
        .hidden { display: none; }
        .back-link { text-align: center; margin-top: 1rem; }
        .back-link a { color: #006e1c; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <h1>SYLUTION</h1>
            <p>Welcome to our marketplace</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="showTab('login')">Login</button>
            <button class="tab" onclick="showTab('register')">Register</button>
        </div>

        <div id="message"></div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="login(event)">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" required placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" required placeholder="Enter password">
            </div>
            <button type="submit" class="btn">Login</button>
        </form>

        <!-- Register Form -->
        <form id="registerForm" class="hidden" onsubmit="register(event)">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="regName" required placeholder="Your full name">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="regEmail" required placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label>Password (min 6 characters)</label>
                <input type="password" id="regPassword" required minlength="6" placeholder="Create password">
            </div>
            <button type="submit" class="btn">Create Account</button>
        </form>

        <div class="back-link">
            <a href="index.html">← Back to Marketplace</a>
        </div>
    </div>

    <script>
        const supabase = window.supabase.createClient('https://svmtbhlaiowbcfzgczsp.supabase.co', 'sb_publishable_1T9UuK1Pxz6ANKaUELwWrA_8Ky_wxWS');

        function showTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('message').innerHTML = '';
            
            if (tab === 'login') {
                document.getElementById('loginForm').classList.remove('hidden');
                document.getElementById('registerForm').classList.add('hidden');
                event.target.classList.add('active');
            } else {
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('registerForm').classList.remove('hidden');
                event.target.classList.add('active');
            }
        }

        async function login(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            
            if (error) {
                document.getElementById('message').innerHTML = `<div class="error">${error.message}</div>`;
            } else {
                document.getElementById('message').innerHTML = `<div class="success">Login successful! Redirecting...</div>`;
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            }
        }

        async function register(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;

            const { data, error } = await supabase.auth.signUp({
                email,
                password,
                options: { data: { full_name: name } }
            });

            if (error) {
                document.getElementById('message').innerHTML = `<div class="error">${error.message}</div>`;
            } else {
                document.getElementById('message').innerHTML = `<div class="success">Account created! Please check your email to confirm.</div>`;
                setTimeout(() => {
                    showTab('login');
                    document.querySelector('.tab:first-child').classList.add('active');
                    document.querySelector('.tab:last-child').classList.remove('active');
                }, 3000);
            }
        }

        // Check if already logged in
        window.onload = async function() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                window.location.href = 'index.html';
            }
        };
    </script>
</body>
</html>
