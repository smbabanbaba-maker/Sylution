<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Login - SYLUTION</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#f8f9fa;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
.card{background:#fff;border-radius:16px;padding:2rem;width:100%;max-width:400px;box-shadow:0 4px 16px rgba(0,0,0,0.1)}
.logo{text-align:center;margin-bottom:1.5rem}
.logo img{width:80px;height:80px;border-radius:12px;margin-bottom:0.5rem}
.logo h1{color:#006e1c;font-size:1.5rem}
.tabs{display:flex;margin-bottom:1.5rem;border-bottom:2px solid #e5e5e5}
.tab{flex:1;padding:0.75rem;border:none;background:none;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px}
.tab.active{color:#006e1c;border-bottom-color:#006e1c}
.form-group{margin-bottom:1.25rem}
.form-group label{display:block;margin-bottom:0.5rem;font-weight:500;font-size:0.9rem}
.form-group input,.form-group select{width:100%;padding:0.875rem;border:2px solid #e5e5e5;border-radius:8px;font-size:1rem}
.form-group input:focus,.form-group select:focus{outline:none;border-color:#006e1c}
.btn{width:100%;padding:0.875rem;border:none;border-radius:8px;font-weight:600;font-size:1rem;cursor:pointer;transition:all 0.3s}
.btn-primary{background:linear-gradient(90deg,#006e1c,#ba1a1a);color:#fff}
.error{background:#fee;color:#c00;padding:1rem;border-radius:8px;margin-bottom:1rem}
.success{background:#d4edda;color:#155724;padding:1rem;border-radius:8px;margin-bottom:1rem}
.link{text-align:center;margin-top:1rem;color:#666}
.link a{color:#006e1c;text-decoration:none;font-weight:600}
.hidden{display:none!important}
</style>
</head>
<body>

<div class="card">
<div class="logo">
<img src="https://raw.githubusercontent.com/smbabanbaba-maker/Sylution/main/IMG-20251129-WA0028.jpg" alt="SYLUTION"/>
<h1>SYLUTION</h1>
</div>

<div class="tabs">
<button class="tab active" onclick="showLogin()">Login</button>
<button class="tab" onclick="showRegister()">Register</button>
</div>

<div id="message"></div>

<form id="loginForm" onsubmit="handleLogin(event)">
<div class="form-group">
<label>Email Address</label>
<input id="loginEmail" required="" type="email" placeholder="your@email.com"/>
</div>
<div class="form-group">
<label>Password</label>
<input id="loginPassword" required="" type="password" placeholder="Enter password"/>
</div>
<button class="btn btn-primary" type="submit">Login</button>
</form>

<form id="registerForm" class="hidden" onsubmit="handleRegister(event)">
<div class="form-group">
<label>Full Name</label>
<input id="regName" required="" type="text" placeholder="Your full name"/>
</div>
<div class="form-group">
<label>Email Address</label>
<input id="regEmail" required="" type="email" placeholder="your@email.com"/>
</div>
<div class="form-group">
<label>Phone Number</label>
<input id="regPhone" required="" type="tel" placeholder="+234 800 000 0000"/>
</div>
<div class="form-group">
<label>Password (min 6 characters)</label>
<input id="regPassword" required="" minlength="6" type="password" placeholder="Create password"/>
</div>
<div class="form-group">
<label>I want to:</label>
<select id="regRole">
<option value="buyer">Buy Products</option>
<option value="seller">Sell Products</option>
</select>
</div>
<button class="btn btn-primary" type="submit">Create Account</button>
</form>

<div class="link">
<p><a href="market.html">← Back to Market</a></p>
</div>
</div>

<script>
const SUPABASE_URL = 'https://svmtbhlaiowbcfzgczsp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_1T9UuK1Pxz6ANKaUELwWrA_8Ky_wxWS';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function showLogin(){
    document.getElementById('loginForm').classList.remove('hidden');
    document.getElementById('registerForm').classList.add('hidden');
    document.querySelectorAll('.tab')[0].classList.add('active');
    document.querySelectorAll('.tab')[1].classList.remove('active');
    document.getElementById('message').innerHTML = '';
}

function showRegister(){
    document.getElementById('loginForm').classList.add('hidden');
    document.getElementById('registerForm').classList.remove('hidden');
    document.querySelectorAll('.tab')[0].classList.remove('active');
    document.querySelectorAll('.tab')[1].classList.add('active');
    document.getElementById('message').innerHTML = '';
}

function showMessage(text, isError){
    const msgDiv = document.getElementById('message');
    msgDiv.innerHTML = `<div class="${isError?'error':'success'}">${text}</div>`;
}

async function handleLogin(e){
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    
    try{
        const {data, error} = await supabase.auth.signInWithPassword({email, password});
        if(error) throw error;
        
        localStorage.setItem('user_email', email);
        localStorage.setItem('user_id', data.user.id);
        
        const {data:userData} = await supabase.from('users').select('role').eq('id', data.user.id).single();
        if(userData){
            localStorage.setItem('user_role', userData.role);
        }
        
        showMessage('✅ Login successful! Redirecting...', false);
        setTimeout(() => {
            window.location.href = 'profile.html';
        }, 1500);
        
    }catch(err){
        showMessage('❌ ' + err.message, true);
    }
}

async function handleRegister(e){
    e.preventDefault();
    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const phone = document.getElementById('regPhone').value.trim();
    const password = document.getElementById('regPassword').value;
    const role = document.getElementById('regRole').value;
    
    try{
        const {data, error} = await supabase.auth.signUp({
            email, password,
            options: {
                data: {
                    full_name: name,
                    phone: phone,
                    role: role
                }
            }
        });
        
        if(error) throw error;
        
        if(data.user){
            await supabase.from('users').insert([{
                id: data.user.id,
                email: email,
                full_name: name,
                phone: phone,
                role: role
            }]);
            
            await supabase.from('wallets').insert([{
                user_id: data.user.id,
                balance: 0,
                currency: 'NGN'
            }]);
        }
        
        showMessage('✅ Account created! Please login.', false);
        setTimeout(() => {
            showLogin();
            document.getElementById('loginEmail').value = email;
        }, 2000);
        
    }catch(err){
        showMessage('❌ ' + err.message, true);
    }
}
</script>
</body>
</html>
