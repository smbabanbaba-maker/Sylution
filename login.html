<script>
const SUPABASE_URL = 'https://svmtbhlaiowbcfzgczsp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_1T9UuK1Pxz6ANKaUELwWrA_8Ky_wxWS';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function togglePassword() {
    const input = document.getElementById('password');
    const icon = document.getElementById('pw-icon');
    if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = 'visibility_off';
    } else {
        input.type = 'password';
        icon.textContent = 'visibility';
    }
}

async function handleLogin() {
    const email = document.getElementById('identifier').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('loginBtn');
    const errorDiv = document.getElementById('loginError');
    errorDiv.classList.add('hidden');

    if (!email || !password) {
        errorDiv.textContent = 'Cika email da password';
        errorDiv.classList.remove('hidden');
        return;
    }

    btn.textContent = 'Ana shiga...';
    btn.disabled = true;

    try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        btn.textContent = '✓ An shiga!';
        setTimeout(() => window.location.href = 'profile.html', 1500);
    } catch (error) {
        errorDiv.textContent = 'Email ko password ba daidai ba ne';
        errorDiv.classList.remove('hidden');
        btn.textContent = 'Login';
        btn.disabled = false;
    }
}

function openSignupModal() {
    document.getElementById('signupModal').classList.remove('hidden');
    document.getElementById('signupModal').classList.add('flex');
}
function closeSignupModal() {
    document.getElementById('signupModal').classList.add('hidden');
    document.getElementById('signupModal').classList.remove('flex');
}

async function handleSignup() {
    const name = document.getElementById('signupName').value.trim();
    const email = document.getElementById('signupEmail').value.trim();
    const phone = document.getElementById('signupPhone').value.trim();
    const password = document.getElementById('signupPassword').value;
    const btn = document.getElementById('signupBtn');
    const errorDiv = document.getElementById('signupError');
    errorDiv.classList.add('hidden');

    if (!name || !email || !password || password.length < 6) {
        errorDiv.textContent = 'Cika duk filayen (password ≥ 6)';
        errorDiv.classList.remove('hidden');
        return;
    }

    btn.textContent = 'Ana ƙirƙira...';
    btn.disabled = true;

    try {
        const { data, error } = await supabase.auth.signUp({
            email, password,
            options: { data: { full_name: name, phone } }
        });
        if (error) throw error;

        if (data.user) {
            await supabase.from('users').insert([{
                id: data.user.id, email, full_name: name, phone, role: 'buyer', tier: 'Bronze', points: 0
            }]);
            await supabase.from('wallets').insert([{ user_id: data.user.id, balance: 0 }]);
        }

        alert('An ƙirƙira account! Yanzu ka iya shiga.');
        closeSignupModal();
        document.getElementById('identifier').value = email;
    } catch (error) {
        errorDiv.textContent = 'Wannan email ɗin yana da rijista';
        errorDiv.classList.remove('hidden');
        btn.textContent = 'Create Account';
        btn.disabled = false;
    }
}

async function forgotPassword() {    const email = document.getElementById('identifier').value.trim();
    if (!email) { alert('Sanya email'); return; }
    try {
        await supabase.auth.resetPasswordForEmail(email);
        alert('An aika email don sauya password');
    } catch (error) {
        alert('Matsala: ' + error.message);
    }
}
</script>
