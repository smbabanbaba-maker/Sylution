<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>My Account - SYLUTION</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@400&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#f5f5f5;color:#333;padding-bottom:80px}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400}
.header{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,0.1);position:sticky;top:0;z-index:100}
.nav{max-width:1400px;margin:0 auto;padding:0.75rem 1rem;display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:0.5rem;font-weight:700;font-size:1.25rem;color:#006e1c;text-decoration:none}
.logo img{width:36px;height:36px;border-radius:8px}
.container{max-width:1200px;margin:0 auto;padding:1rem}
.card{background:#fff;border-radius:12px;padding:1.5rem;margin-bottom:1rem;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.card h2{margin-bottom:1rem;font-size:1.25rem;display:flex;align-items:center;gap:0.5rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem;margin-bottom:1rem}
.stat{background:linear-gradient(135deg,#006e1c,#ba1a1a);color:#fff;padding:1rem;border-radius:12px;text-align:center}
.stat-value{font-size:1.5rem;font-weight:700}
.stat-label{font-size:0.8rem;opacity:0.9}
.order-item{border:1px solid #e5e5e5;border-radius:8px;padding:1rem;margin-bottom:0.75rem}
.order-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem}
.order-status{padding:0.25rem 0.75rem;border-radius:9999px;font-size:0.75rem;font-weight:600}
.status-pending{background:#fff3cd;color:#856404}
.status-confirmed{background:#d1ecf1;color:#0c5460}
.status-shipped{background:#d4edda;color:#155724}
.status-delivered{background:#c3e6cb;color:#155724}
.status-cancelled{background:#f8d7da;color:#721c24}
.btn{padding:0.5rem 1rem;border-radius:9999px;font-weight:600;cursor:pointer;border:none;transition:all 0.3s;font-size:0.875rem}
.btn-primary{background:linear-gradient(90deg,#006e1c,#ba1a1a);color:#fff}
.btn-outline{border:2px solid #006e1c;color:#006e1c;background:transparent}
.btn-danger{background:#dc3545;color:#fff}
.tabs{display:flex;gap:0.5rem;margin-bottom:1rem;border-bottom:2px solid #e5e5e5;overflow-x:auto}
.tab{padding:0.75rem 1rem;cursor:pointer;border:none;background:none;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-2px;font-size:0.9rem;white-space:nowrap}
.tab.active{color:#006e1c;border-bottom-color:#006e1c}
.form-group{margin-bottom:1rem}
.form-group label{display:block;margin-bottom:0.5rem;font-weight:500;font-size:0.9rem}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:0.75rem;border:2px solid #e5e5e5;border-radius:0.5rem;font-size:0.95rem}
.form-group input:focus,.form-group textarea:focus{outline:none;border-color:#006e1c}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;align-items:center;justify-content:center;padding:1rem}
.modal.active{display:flex}
.modal-content{background:#fff;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;border-radius:1rem;padding:1.5rem;position:relative}
.modal-close{position:absolute;top:1rem;right:1rem;background:none;border:none;font-size:1.5rem;cursor:pointer}
.loading{text-align:center;padding:3rem;color:#666}
.error{background:#fee;color:#c00;padding:1rem;border-radius:0.5rem;margin:1rem 0}
.success{background:#efe;color:#006e1c;padding:1rem;border-radius:0.5rem;margin:1rem 0}
.footer{background:#000;color:#fff;padding:1.5rem 1rem;text-align:center;margin-top:2rem}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e5e5;display:flex;justify-content:space-around;padding:0.5rem;z-index:100}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:0.25rem;color:#666;text-decoration:none;font-size:0.75rem}
.bottom-nav a.active{color:#006e1c}
</style>
</head>
<body>

<header class="header">
<div class="nav">
<a class="logo" href="index.html">
<img src="https://raw.githubusercontent.com/smbabanbaba-maker/Sylution/main/IMG-20251129-WA0028.jpg" alt="SYLUTION"/>
SYLUTION
</a>
<a href="market.html" class="btn btn-outline">Back to Market</a>
</div>
</header>

<main class="container" id="mainContent">
<div class="loading">Loading your account...</div>
</main>

<footer class="footer">
<p>© 2025 SYLUTION LTD. Smart Technology • Green Future 🌍</p>
</footer>

<nav class="bottom-nav">
<a href="market.html"><span class="material-symbols-outlined">storefront</span>Market</a>
<a href="profile.html" class="active"><span class="material-symbols-outlined">person</span>Account</a>
<a href="#" onclick="showAddFunds();return false"><span class="material-symbols-outlined">account_balance_wallet</span>Wallet</a>
<a href="#" onclick="handleLogout();return false"><span class="material-symbols-outlined">logout</span>Logout</a>
</nav>

<script>
const SUPABASE_URL = 'https://svmtbhlaiowbcfzgczsp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_1T9UuK1Pxz6ANKaUELwWrA_8Ky_wxWS';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let userWallet = 0;
let currentTab = 'orders';

async function init(){
    const {data:{session}} = await supabase.auth.getSession();
    if(!session){
        window.location.href = 'market.html';
        return;
    }
    currentUser = session.user;
    await loadProfile();
}

async function loadProfile(){
    const main = document.getElementById('mainContent');
    
    try{
        // Load wallet
        const {data:walletData} = await supabase.from('wallets').select('balance').eq('user_id', currentUser.id).single();
        userWallet = walletData?.balance || 0;
        
        // Load orders
        const {data:orders} = await supabase.from('orders').select('*').eq('buyer_id', currentUser.id).order('created_at',{ascending:false});
        
        // Load user products (if seller)
        const {data:products} = await supabase.from('products').select('*').eq('seller_id', currentUser.id).order('created_at',{ascending:false});
        
        main.innerHTML = `
            <div class="card">
                <h2><span class="material-symbols-outlined">person</span> Welcome, ${currentUser.user_metadata?.full_name || 'User'}</h2>
                <p style="color:#666">${currentUser.email}</p>
                <p style="color:#666;font-size:0.9rem">${currentUser.user_metadata?.phone || 'No phone'}</p>
            </div>
            
            <div class="stats">
                <div class="stat">
                    <div class="stat-value">₦${userWallet.toLocaleString()}</div>
                    <div class="stat-label">Wallet Balance</div>
                </div>
                <div class="stat">
                    <div class="stat-value">${orders?.length || 0}</div>
                    <div class="stat-label">Total Orders</div>
                </div>
                <div class="stat">
                    <div class="stat-value">${products?.length || 0}</div>
                    <div class="stat-label">My Products</div>
                </div>
            </div>
            
            <div class="tabs">
                <button class="tab ${currentTab==='orders'?'active':''}" onclick="switchTab('orders',this)">My Orders</button>
                <button class="tab ${currentTab==='products'?'active':''}" onclick="switchTab('products',this)">My Products</button>
                <button class="tab ${currentTab==='wallet'?'active':''}" onclick="switchTab('wallet',this)">Wallet</button>
            </div>
            
            <div id="tabContent"></div>
        `;
        
        renderTabContent(orders, products);
    }catch(e){
        main.innerHTML = '<div class="error">Error loading profile: ' + e.message + '</div>';
    }
}

function switchTab(tab, btn){
    currentTab = tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    loadProfile();
}

function renderTabContent(orders, products){
    const content = document.getElementById('tabContent');
    
    if(currentTab === 'orders'){
        if(!orders || orders.length === 0){
            content.innerHTML = '<div class="card"><p>No orders yet. Start shopping!</p></div>';
        }else{
            content.innerHTML = orders.map(o => `
                <div class="order-item">
                    <div class="order-header">
                        <strong>Order #${o.order_number}</strong>
                        <span class="order-status status-${o.status}">${o.status}</span>
                    </div>
                    <p style="font-size:0.9rem;color:#666">${o.notes}</p>
                    <div style="display:flex;justify-content:space-between;margin-top:0.5rem">
                        <span style="font-weight:700;color:#006e1c">${Number(o.total_price).toLocaleString()}</span>
                        <span style="font-size:0.8rem;color:#666">${new Date(o.created_at).toLocaleDateString()}</span>
                    </div>
                    ${o.status === 'pending' ? `<button class="btn btn-danger" style="margin-top:0.5rem" onclick="cancelOrder('${o.id}')">Cancel Order</button>` : ''}
                </div>
            `).join('');
        }
    }else if(currentTab === 'products'){
        if(!products || products.length === 0){
            content.innerHTML = '<div class="card"><p>No products yet. <a href="market.html" style="color:#006e1c">Add your first product!</a></p></div>';
        }else{
            content.innerHTML = products.map(p => `
                <div class="order-item">
                    <div class="order-header">
                        <strong>${p.name}</strong>
                        <span class="order-status ${p.is_available?'status-delivered':'status-pending'}">${p.is_available?'Active':'Pending Review'}</span>
                    </div>
                    <p style="font-size:0.9rem;color:#666">${p.category} • ${p.city}</p>
                    <div style="display:flex;justify-content:space-between;margin-top:0.5rem">
                        <span style="font-weight:700;color:#006e1c">${Number(p.price).toLocaleString()}</span>
                        <span style="font-size:0.8rem;color:#666">Qty: ${p.quantity}</span>
                    </div>
                </div>
            `).join('');
        }
    }else if(currentTab === 'wallet'){
        content.innerHTML = `
            <div class="card">
                <h2><span class="material-symbols-outlined">account_balance_wallet</span> Wallet Balance</h2>
                <div style="font-size:2rem;font-weight:700;color:#006e1c;margin:1rem 0">₦${userWallet.toLocaleString()}</div>
                <button class="btn btn-primary" onclick="showAddFunds()">Add Funds</button>
                <button class="btn btn-outline" onclick="withdrawFunds()">Withdraw</button>
            </div>
            <div class="card">
                <h3>How to add funds:</h3>
                <ol style="margin-left:1.5rem;margin-top:0.5rem;color:#666">
                    <li>Click "Add Funds"</li>
                    <li>Enter amount</li>
                    <li>Admin will confirm via WhatsApp</li>
                    <li>Funds will be added to your wallet</li>
                </ol>
            </div>
        `;
    }
}

async function cancelOrder(orderId){
    if(!confirm('Are you sure you want to cancel this order?')) return;
    
    try{
        await supabase.from('orders').update({status:'cancelled'}).eq('id', orderId);
        alert('Order cancelled');
        loadProfile();
    }catch(e){
        alert('Error: ' + e.message);
    }
}

function showAddFunds(){
    const amount = prompt('Enter amount to add (₦):');
    if(!amount || isNaN(amount) || amount <= 0){
        alert('Invalid amount');
        return;
    }
    
    const msg = `Hello SYLUTION! I want to add ₦${Number(amount).toLocaleString()} to my wallet.\n\nName: ${currentUser.user_metadata?.full_name}\nEmail: ${currentUser.email}`;
    window.open(`https://wa.me/2349063436048?text=${encodeURIComponent(msg)}`,'_blank');
    alert('Please complete payment via WhatsApp. Admin will credit your wallet.');
}

function withdrawFunds(){
    const amount = prompt('Enter amount to withdraw (₦):');
    if(!amount || isNaN(amount) || amount <= 0){
        alert('Invalid amount');
        return;
    }
    if(amount > userWallet){
        alert('Insufficient balance');
        return;
    }
    
    const msg = `Hello SYLUTION! I want to withdraw ₦${Number(amount).toLocaleString()} from my wallet.\n\nName: ${currentUser.user_metadata?.full_name}\nEmail: ${currentUser.email}\nCurrent Balance: ₦${userWallet.toLocaleString()}`;
    window.open(`https://wa.me/2349063436048?text=${encodeURIComponent(msg)}`,'_blank');
    alert('Withdrawal request sent. Admin will process it shortly.');
}

async function handleLogout(){
    await supabase.auth.signOut();
    window.location.href = 'market.html';
}

init();
</script>
</body></html>
