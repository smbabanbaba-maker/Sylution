<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>My Orders - SYLUTION</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@400&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#f5f5f5;color:#333}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400}
.header{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,0.1);position:sticky;top:0;z-index:100}
.nav{max-width:1200px;margin:0 auto;padding:0.75rem 1rem;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:700;font-size:1.25rem;color:#006e1c;text-decoration:none}
.container{max-width:800px;margin:0 auto;padding:1rem}
.order-card{background:#fff;border-radius:12px;padding:1rem;margin-bottom:1rem;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.order-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.75rem;padding-bottom:0.75rem;border-bottom:1px solid #e5e5e5}
.order-number{font-weight:700;color:#006e1c}
.order-status{padding:0.25rem 0.75rem;border-radius:9999px;font-size:0.75rem;font-weight:600}
.status-pending{background:#fff3cd;color:#856404}
.status-confirmed{background:#d1ecf1;color:#0c5460}
.status-processing{background:#d4edda;color:#155724}
.status-shipped{background:#c3e6cb;color:#155724}
.status-delivered{background:#d4edda;color:#155724}
.status-cancelled{background:#f8d7da;color:#721c24}
.order-details{font-size:0.9rem;color:#666;margin-bottom:0.5rem}
.order-total{font-weight:700;color:#006e1c;margin-top:0.5rem}
.btn{padding:0.5rem 1rem;border-radius:9999px;font-weight:600;cursor:pointer;border:none;transition:all 0.3s;font-size:0.875rem;margin-top:0.5rem}
.btn-primary{background:linear-gradient(90deg,#006e1c,#ba1a1a);color:#fff}
.loading{text-align:center;padding:3rem;color:#666}
.footer{background:#000;color:#fff;padding:1.5rem;text-align:center;margin-top:2rem}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e5e5;display:flex;justify-content:space-around;padding:0.5rem}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:0.25rem;color:#666;text-decoration:none;font-size:0.75rem}
.bottom-nav a.active{color:#006e1c}
</style>
</head>
<body>

<header class="header">
<div class="nav">
<a class="logo" href="index.html">SYLUTION</a>
<a href="market.html" style="color:#006e1c;text-decoration:none">Back to Market</a>
</div>
</header>

<main class="container">
<h1 style="margin-bottom:1rem">My Orders</h1>
<div id="ordersList">
<div class="loading">Loading your orders...</div>
</div>
</main>

<footer class="footer">
<p>© 2025 SYLUTION LTD. Smart Technology • Green Future 🌍</p>
</footer>

<nav class="bottom-nav">
<a href="market.html"><span class="material-symbols-outlined">storefront</span>Market</a>
<a href="orders.html" class="active"><span class="material-symbols-outlined">receipt_long</span>Orders</a>
<a href="login.html"><span class="material-symbols-outlined">person</span>Login</a>
</nav>

<script>
const SUPABASE_URL = 'https://svmtbhlaiowbcfzgczsp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_1T9UuK1Pxz6ANKaUELwWrA_8Ky_wxWS';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function loadOrders(){
    const ordersDiv = document.getElementById('ordersList');
    
    try{
        // Get orders by phone (for non-logged in users)
        const phone = localStorage.getItem('user_phone') || '';
        
        let query = supabase.from('orders').select('*').order('created_at', {ascending: false});
        
        if(phone){
            query = query.eq('buyer_phone', phone);
        }
        
        const {data, error} = await query.limit(50);
        
        if(error) throw error;
        
        if(!data || data.length === 0){
            ordersDiv.innerHTML = '<div style="background:#fff;padding:2rem;border-radius:12px;text-align:center;color:#666">No orders yet. <a href="market.html" style="color:#006e1c">Start shopping!</a></div>';
            return;
        }
        
        ordersDiv.innerHTML = data.map(o => `
            <div class="order-card">
                <div class="order-header">
                    <span class="order-number">Order #${o.order_number}</span>
                    <span class="order-status status-${o.status}">${o.status}</span>
                </div>
                <div class="order-details">
                    <strong>Product:</strong> ${o.product_name}<br>
                    <strong>Quantity:</strong> ${o.quantity}<br>
                    <strong>Payment:</strong> ${o.payment_method}<br>
                    <strong>Date:</strong> ${new Date(o.created_at).toLocaleDateString()}<br>
                    ${o.delivery_address?`<strong>Delivery:</strong> ${o.delivery_address}<br>`:''}
                </div>
                <div class="order-total">Total: ₦${Number(o.total_price).toLocaleString()}</div>
                ${o.status === 'pending' ? `<button class="btn btn-primary" onclick="contactAdmin('${o.order_number}')">Contact Admin</button>` : ''}
            </div>
        `).join('');
        
    }catch(e){
        console.error('Error:', e);
        ordersDiv.innerHTML = '<div style="background:#fee;color:#c00;padding:1rem;border-radius:8px">Error loading orders</div>';
    }
}

function contactAdmin(orderNum){
    const msg = `Hello, I want to confirm payment for Order #${orderNum}`;
    window.open(`https://wa.me/2349063436048?text=${encodeURIComponent(msg)}`,'_blank');
}

// Save phone to localStorage when user places order
const urlParams = new URLSearchParams(window.location.search);
if(urlParams.has('phone')){
    localStorage.setItem('user_phone', urlParams.get('phone'));
}

loadOrders();
</script>
</body></html>
